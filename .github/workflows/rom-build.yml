name: ROM build
on:
  push:
    branches: ['main', 'codex/**', 'claude/**']
    paths:
      - '.github/workflows/rom-build.yml'
      - 'project/src/**'
      - 'project/data/**'
      - 'project/include/**'
      - 'project/asm/**'
      - 'project/graphics/**'
      - 'project/sound/**'
      - 'project/tools/**'
      - 'project/scripts/**'
      - 'project/libagbsyscall/**'
      - 'project/Makefile'
      - 'project/*.mk'
      - 'project/*.txt'
      - 'project/*.ld'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rom-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [normal, release]
    defaults:
      run:
        working-directory: project
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install compiler and asset tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 python3-pil
      - name: Source and native checks (no emulator)
        env:
          PYTHONUTF8: '1'
        run: |
          set -o pipefail
          mkdir -p artifacts/cloud
          {
            python3 scripts/tests/check-world-fixes.py
            python3 scripts/tests/check-immediate-scripts.py
            python3 scripts/tests/check-playtest-20261010.py
            python3 scripts/tests/check-text.py
            python3 scripts/tests/test-story-movement.py
          } 2>&1 | tee artifacts/cloud/checks.log
      - name: Compile without running the ROM
        run: |
          set -o pipefail
          mkdir -p artifacts/cloud
          target=()
          if [[ "${{ matrix.variant }}" == release ]]; then target=(release); fi
          make -j2 CRASH_TRACE=0 "${target[@]}" 2>&1 | tee artifacts/cloud/build.log
      - name: Compile RAM-only diagnostic helper
        if: matrix.variant == 'normal'
        run: |
          # Compile the opt-in branch too, without linking or running a ROM.
          rm build/emerald/src/crash_trace.o
          make -j2 CRASH_TRACE=1 build/emerald/src/crash_trace.o
      - name: Record exact build source and hashes
        run: |
          variant="${{ matrix.variant }}"
          stem=pokeemerald
          if [[ "$variant" == release ]]; then stem=pokeemerald-release; fi
          test -s "$stem.gba"
          cp "$stem.gba" "$stem.elf" "$stem.map" artifacts/cloud/
          cp artifacts/audit/world-current.json artifacts/cloud/
          sha256sum "artifacts/cloud/$stem.gba" > artifacts/cloud/SHA256SUMS
          printf 'commit=%s\nbranch=%s\nvariant=%s\ncrash_trace=0\nrun=%s\nbuilt_utc=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$variant" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > artifacts/cloud/BUILD_SOURCE.txt
          arm-none-eabi-gcc --version >> artifacts/cloud/BUILD_SOURCE.txt
      - name: Upload build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emerald-${{ matrix.variant }}-${{ github.sha }}
          path: project/artifacts/cloud/
          retention-days: 30
          if-no-files-found: error
